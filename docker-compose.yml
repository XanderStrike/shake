version: '3.8'

services:
  # Caddy handles TLS termination and reverse proxies to the two backend services.
  # For public deployments with a real domain, replace "tls internal" in the
  # Caddyfile with your domain name and Caddy will obtain a Let's Encrypt cert
  # automatically. For LAN/local-IP access, keep "tls internal" and run
  # `docker exec caddy caddy trust` once to install the local CA.
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"     # HTTP — redirected to HTTPS by Caddy
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  # shake-dev serves the game client (static files) via nginx on port 80 inside
  # the Docker network. Caddy proxies HTTPS traffic to it; port 80 is NOT
  # exposed directly to the host.
  #
  # Nginx startup logs ("default.conf differs from the packaged version") are
  # expected — they simply indicate that our custom nginx.conf has replaced
  # nginx's built-in default. The "Configuration complete; ready for start up"
  # line confirms everything is fine.
  shake-dev:
    image: nginx:latest
    container_name: shake-dev
    restart: always
    volumes:
      - ./client:/usr/share/nginx/html
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

  shake-server:
    image: xanderstrike/shake-server:latest
    container_name: shake-server
    restart: always

volumes:
  caddy_data:
  caddy_config:
