services:
  shake:
    build: .
    container_name: shake
    restart: always
    environment:
      - VIRTUAL_HOST=shake.astandke.com
      - LETSENCRYPT_HOST=shake.astandke.com
      - VIRTUAL_PORT=8080
    volumes:
      # pk3 assets (pak0-pak8 + custom maps) are gitignored and live on the host;
      # mount them into the static dir the Go server serves from /.
      - ./demoq3:/static/demoq3
