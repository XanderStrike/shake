server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve all static assets with a long cache lifetime.
    location ~* \.(js|wasm|pk3|gz|css|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fall back to index.html for any path not matched above so that
    # query-string parameters (?server=, ?map=, ?lonely) still work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
